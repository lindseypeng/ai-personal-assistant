<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Berlin Listings{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f4f1;
            --surface: #fcfcfb;
            --border: #e2e1dc;
            --text: #0b0b0b;
            --text-2: #52514e;
            --text-3: #77766f;
            --accent: #2a78d6;
            --accent-soft: #e3eefb;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #111110;
                --surface: #1a1a19;
                --border: #2f2e2b;
                --text: #f0efec;
                --text-2: #c3c2b7;
                --text-3: #94938a;
                --accent: #3987e5;
                --accent-soft: #1d2a3b;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #111110;
            --surface: #1a1a19;
            --border: #2f2e2b;
            --text: #f0efec;
            --text-2: #c3c2b7;
            --text-3: #94938a;
            --accent: #3987e5;
            --accent-soft: #1d2a3b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        header {
            display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
            padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        header .brand { font-weight: 600; }
        nav { display: flex; gap: 4px; }
        nav a {
            color: var(--text-2); text-decoration: none; padding: 6px 12px; border-radius: 6px;
        }
        nav a:hover { color: var(--text); background: var(--bg); }
        nav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
        main { max-width: 1100px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .subtitle { color: var(--text-2); margin: 0 0 20px; }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
        }
        a { color: var(--accent); }

        /* Filter bar, shared by every page */
        .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 20px; }
        .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-2); }
        .filters select, .filters input {
            font: inherit; color: var(--text); background: var(--surface);
            border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 120px;
        }
        .filters input { width: 120px; }
        .filters button {
            font: inherit; color: var(--text-2); background: none; border: none; cursor: pointer; padding: 6px 4px;
        }
        .filters button:hover { color: var(--text); text-decoration: underline; }
        @media (max-width: 600px) {
            main { padding: 16px; }
            header { padding: 12px 16px; }
            .filters label { flex: 1 1 40%; }
            .filters select, .filters input { width: 100%; min-width: 0; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <span class="brand">Berlin Listings</span>
        <nav>
            <a href="/map" class="{{ 'active' if page == 'map' }}">Map</a>
            <a href="/prices" class="{{ 'active' if page == 'prices' }}">Prices</a>
            <a href="/chat" class="{{ 'active' if page == 'chat' }}">Chat</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // Rooms choices: "2" means 2 to 2.5 rooms, "4" means 4 or more
        const ROOM_RANGES = {"1": [1, 1.5], "2": [2, 2.5], "3": [3, 3.5], "4": [4, null]};

        // Turn the filter bar into query parameters for /api/..., and keep them in the page URL
        function readFilters() {
            const form = document.getElementById("filters");
            const params = new URLSearchParams();
            const rooms = ROOM_RANGES[form.rooms.value];
            if (rooms) {
                params.set("min_rooms", rooms[0]);
                if (rooms[1] !== null) params.set("max_rooms", rooms[1]);
            }
            for (const name of ["district", "min_size", "max_price"]) {
                if (form[name].value) params.set(name, form[name].value);
            }
            const pageParams = new URLSearchParams(params);
            if (form.rooms.value) { pageParams.delete("min_rooms"); pageParams.delete("max_rooms"); pageParams.set("rooms", form.rooms.value); }
            history.replaceState(null, "", "?" + pageParams.toString());
            return params;
        }

        // Fill the filter bar from the page URL, so a shared link shows the same view
        function restoreFilters() {
            const form = document.getElementById("filters");
            const params = new URLSearchParams(location.search);
            for (const name of ["rooms", "district", "min_size", "max_price"]) {
                if (params.has(name)) form[name].value = params.get(name);
            }
        }

        // Watch the filter bar and call onChange with fresh query parameters
        function setupFilters(onChange) {
            const form = document.getElementById("filters");
            restoreFilters();
            let timer;
            form.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => onChange(readFilters()), 250); });
            form.addEventListener("reset", () => setTimeout(() => onChange(readFilters()), 0));
            form.addEventListener("submit", (event) => event.preventDefault());
            onChange(readFilters());
        }

        // Text from emails is shown with textContent and only https links are clickable
        function el(tag, attrs = {}, ...children) {
            const node = document.createElement(tag);
            for (const [key, value] of Object.entries(attrs)) {
                if (key === "href") { if (/^https:\/\//.test(value)) node.href = value; }
                else node.setAttribute(key, value);
            }
            for (const child of children) node.append(child ?? "");
            return node;
        }

        const euro = (value) => value == null ? "–" : Math.round(value).toLocaleString("de-DE") + " €";
        const color = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
